[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-for-opensource-funding"
version = "1.0.0"
description = "Fundraising / developer-relations bot: GitHub sponsor outreach and content syndication for promoting an open-source projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhargav Bhatt" }]
requires-python = ">=3.10"
keywords = [
    "genesys",
    "sponsor",
    "fundraising",
    "outreach",
    "content-syndication",
    "developer-relations",
    "github",
    "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/bhkbdbhatt/bot-for-opensource-funding"
Repository = "https://github.com/bhkbdbhatt/bot-for-opensource-funding"
Issues = "https://github.com/bhkbdbhatt/bot-for-opensource-funding/issues"
Changelog = "https://github.com/bhkbdbhatt/bot-for-opensource-funding/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
genesys-sponsor-bot = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "main",
    "config_loader",
    "models",
    "state",
    "tracker",
    "content_store",
    "platforms",
    "discovery",
    "prompt_engine",
    "content_engine",
    "llm",
    "scheduler",
    "promoter",
    "logging_setup",
    "sources",
]

[tool.setuptools.packages.find]
include = ["senders*", "publishers*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", ".ruff_cache", "__pycache__"]

[tool.ruff.lint]
# Baseline per ARCHITECTURE.md: pyflakes errors + syntax-level pycodestyle.
# UP (pyupgrade) is deliberately excluded - the codebase uses the typing.Dict /
# typing.List style in older modules on purpose.
select = ["F", "E9"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
